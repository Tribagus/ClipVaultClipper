
name: Build ClipVault Clipper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract source ZIP
        run: |
          echo "Files in repository:"
          ls -la
          ZIP="$(find . -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi
          echo "Found source: $ZIP"
          unzip -q "$ZIP" -d /tmp/clipvault-source
          find /tmp/clipvault-source -maxdepth 3 -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT="$(find /tmp/clipvault-source -name settings.gradle.kts -print -quit | xargs dirname)"
          echo "Project directory: $PROJECT"
          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-debug-apk
          path: /tmp/clipvault-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
