name: Build ClipVault Clipper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          unzip -q ClipVault_Clipper_Android_Source.zip -d .

      - name: Build APK
        run: gradle -p ClipVaultClipper assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-debug-apk
          path: ClipVaultClipper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
